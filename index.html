  .map(x=>x.replace(/^\s*(?:[A-Da-d][\).\:-]|\d+[\).\:-]|[•\-–])\s*/,'').trim())

async function imageToDataUrl(file){
 if(!file)return '';
 if(!file.type.startsWith('image/'))throw Error('กรุณาเลือกไฟล์รูปภาพเท่านั้น');
 if(file.size>5*1024*1024)throw Error('รูปภาพต้นฉบับต้องไม่เกิน 5 MB');
 const img=await new Promise((res,rej)=>{
  const im=new Image();
  im.onload=()=>res(im);
  im.onerror=()=>rej(Error('อ่านไฟล์รูปภาพไม่สำเร็จ'));
  im.src=URL.createObjectURL(file);
 });
 const max=900,scale=Math.min(1,max/Math.max(img.width,img.height));
 const canvas=document.createElement('canvas');
 canvas.width=Math.max(1,Math.round(img.width*scale));
 canvas.height=Math.max(1,Math.round(img.height*scale));
 canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
 URL.revokeObjectURL(img.src);
 const out=canvas.toDataURL('image/jpeg',0.68);
 if(out.length>950000)throw Error('รูปภาพยังใหญ่เกินไป กรุณาเลือกรูปที่เล็กลง');
 return out;
}
function formatSelectedText(target,tag){
 const el=document.querySelector(`[data-rich-target="${CSS.escape(target)}"]`);
 if(!el)return;
 const start=el.selectionStart??el.value.length,end=el.selectionEnd??el.value.length;
 const selected=el.value.slice(start,end);
 let wrapped='';
 if(tag==='sup')wrapped=`<sup>${selected||'2'}</sup>`;
 else if(tag==='sub')wrapped=`<sub>${selected||'2'}</sub>`;
 else if(tag==='bold')wrapped=`<b>${selected||'ข้อความ'}</b>`;
 else if(tag==='italic')wrapped=`<i>${selected||'ข้อความ'}</i>`;
 else if(tag==='frac'){
  const raw=selected||'เศษ/ส่วน';
  const parts=raw.includes('/')?raw.split('/'):[raw,'ส่วน'];
  wrapped=`<frac>${(parts[0]||'เศษ').trim()}|${(parts.slice(1).join('/')||'ส่วน').trim()}</frac>`;
 }
 el.value=el.value.slice(0,start)+wrapped+el.value.slice(end);
 const pos=start+wrapped.length;
 el.focus();el.setSelectionRange(pos,pos);
 el.dispatchEvent(new Event('input',{bubbles:true}));
}

function timeline(events){events=events.filter(e=>['page_hidden','page_visible','page_exit','page_return'].includes(e.kind));const pairs={page_hidden:'page_visible',page_exit:'page_return'},opened={};return events.map(e=>{const time=new Date(e.client_at||e.received_at).getTime();let duration='';for(const [start,end] of Object.entries(pairs))if(e.kind===end&&opened[start]!=null){const seconds=Math.max(0,Math.round((time-opened[start])/1000));duration=` · ห่างไปประมาณ ${seconds} วินาที`;delete opened[start];}if(pairs[e.kind]&&opened[e.kind]==null)opened[e.kind]=time;return `<tr><td>${esc(eventLabel(e.kind)+duration)}</td><td>${e.client_at?date(e.client_at):'—'}</td><td>${date(e.received_at)}</td></tr>`;}).join('');}

bmission_type==='auto'?'ส่งอัตโนมัติ':'ส่งแล้ว'):'กำลังทำ'}${r.pending_grades?'<br>รอตรวจ '+r.pending_grades+' ข้อ':''}</td><td>${r.score} / ${r.total_score}</td><td><button data-action="attempt-report" data-id="${r.id}">คำตอบและเหตุการณ์</button></td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<div class="empty">ยังไม่มีนักเรียนเริ่มสอบในห้องที่เลือก</div>'}</div>`;}function requireXLSX(){if(typeof XLSX==='undefined')throw Error('โหลดระบบ Excel ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่')}

async function previewStudentExcel(file){requireXLSX();const wb=XLSX.read(await file.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});const classMap=new Map(classes.filter(c=>!c.archived).map(c=>[c.name.trim(),c.id]));const existingNumbers=new Set();students.forEach(s=>(s.classes||[]).forEach(c=>{if(c.student_number)existingNumbers.add(c.id+'|'+String(c.student_number).trim())}));const seenCode=new Set(),seenNo=new Set();const parsed=rows.map((r,i)=>{const student_number=String(r['เลขที่']||'').trim(),code=String(r['รหัสนักเรียน']||'').trim().toUpperCase(),name=String(r['ชื่อ–นามสกุล']||'').trim(),password=String(r['รหัสผ่าน']||''),className=String(r['ห้องเรียน']||'').trim(),class_id=classMap.get(className);let error='';if(!/^\d{1,3}$/.test(student_number)||Number(student_number)<1)error='เลขที่ไม่ถูกต้อง';else if(!/^[A-Z0-9_-]{1,40}$/.test(code))error='รหัสนักเรียนไม่ถูกต้อง';else if(!name)error='ไม่มีชื่อ';else if(!/^\d{4}$/.test(password))error='รหัสผ่านต้องเป็นตัวเลข 4 ตัว';else if(!class_id)error='ไม่พบห้องเรียน';else if(seenCode.has(code))error='รหัสซ้ำในไฟล์';else if(seenNo.has(class_id+'|'+student_number))error='เลขที่ซ้ำในห้องเดียวกัน';else if(existingNumbers.has(class_id+'|'+student_number))error='เลขที่นี้มีอยู่แล้วในห้อง';seenCode.add(code);if(class_id)seenNo.add(class_id+'|'+student_number);return {row:i+2,student_number,student_code:code,name,password,class_id,class_name:className,error}});window._studentImport=parsed;const ok=parsed.filter(x=>!x.error);$('#import-preview').innerHTML=`<p><strong>พร้อมนำเข้า ${ok.length}</strong> · มีปัญหา ${parsed.length-ok.length}</p><div class="tablewrap"><table><thead><tr><th>แถว</th><th>เลขที่</th><th>รหัส</th><th>ชื่อ</th><th>ห้อง</th><th>สถานะ</th></tr></thead><tbody>${parsed.map(x=>`<tr><td>${x.row}</td><td>${esc(x.student_number)}</td><td>${esc(x.student_code)}</td><td>${esc(x.name)}</td><td>${esc(x.class_name)}</td><td class="${x.error?'danger':'good'}">${esc(x.error||'พร้อมนำเข้า')}</td></tr>`).join('')}</tbody></table></div><button data-action="confirm-import-students" ${parsed.some(x=>x.error)||!parsed.length?'disabled':''}>นำเข้า ${ok.length} คน</button>`;}
function exportReportExcel(){requireXLSX();const rows=window._reportRows||[],summary=window._reportSummary||{};const e=exams.find(x=>x.id===lastExam)||{};const room=classes.find(c=>c.id===window._reportClass)?.name||'ทุกห้องเรียน';const data=rows.map(r=>({'เลขที่':r.student_number||'','รหัสนักเรียน':r.student_code,'ชื่อ–นามสกุล':r.student_name,'ห้องเรียน':(r.class_names||[]).join(', '),'สถานะ':r.status==='submitted'?'ส่งแล้ว':'กำลังทำ','คะแนน':r.score,'คะแนนเต็ม':r.total_score,'เริ่มสอบ':r.started_at?date(r.started_at):'','ส่งข้อสอบ':r.submitted_at?date(r.submitted_at):''}));const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet([[`ข้อสอบ: ${e.title||''}`],[`วิชา: ${e.subject||''}`],[`รหัสวิชา: ${e.course||''}`],[`ห้องเรียน: ${room}`],[`เฉลี่ย: ${summary.average??'-'} | สูงสุด: ${summary.maximum??'-'} | ต่ำสุด: ${summary.minimum??'-'}`],[]]);XLSX.utils.sheet_add_json(ws,data,{origin:'A7'});XLSX.utils.book_append_sheet(wb,ws,'ผลสอบ');XLSX.writeFile(wb,`ผลสอบ_${safeFile(e.title||'exam')}_${safeFile(room)}.xlsx`)}
function exportReportOptions(){
 const activeClasses=classes.filter(c=>!c.archived);

async function exportCumulativeReportExcel(classId=null,examIds=null){
 requireXLSX();
 const activeClasses=classes.filter(c=>!c.archived);
 const selectedClass=classId ?? window._cumulativeClassFilter ?? activeClasses[0]?.id ?? '';
 const ids=(examIds&&examIds.length?examIds:(window._cumulativeExamIds?.length?window._cumulativeExamIds:exams.map(e=>e.id))).filter(id=>exams.some(e=>e.id===id));
 if(!ids.length)throw Error('กรุณาเลือกแบบทดสอบอย่างน้อย 1 ชุด');
 const selectedExams=exams.filter(e=>ids.includes(e.id));
 const shownStudents=(selectedClass?students.filter(s=>s.classes.some(c=>c.id===selectedClass)):students).map(s=>({...s,room:studentRoom(s,selectedClass)})).sort((a,b)=>(Number(a.room.student_number)||9999)-(Number(b.room.student_number)||9999)||String(a.student_code).localeCompare(String(b.student_code),'th'));
 const reportLists=await Promise.all(selectedExams.map(e=>api('report',{exam_id:e.id,...(selectedClass?{class_id:selectedClass}:{})}).then(rows=>({exam:e,rows}))));
 const byStudent={};for(const pack of reportLists){for(const r of pack.rows||[]){byStudent[r.student_id]??={};byStudent[r.student_id][pack.exam.id]=r;}}
 const totalPossible=selectedExams.reduce((s,e)=>s+Number(e.total_score||0),0);
 const rows=shownStudents.map(st=>{const scores=selectedExams.map(e=>byStudent[st.id]?.[e.id]||null);const sum=scores.reduce((n,r)=>n+(r&&r.status==='submitted'?Number(r.score||0):0),0);return {student:st,scores,sum,total:totalPossible,percent:totalPossible?Math.round(sum/totalPossible*10000)/100:0};});
 const room=classes.find(c=>c.id===selectedClass)?.name||'ทุกห้องเรียน';
 const data=rows.map(x=>{const out={'เลขที่':x.student.room.student_number||'','รหัสนักเรียน':x.student.student_code,'ชื่อ–นามสกุล':x.student.name,'ห้องเรียน':(x.student.classes||[]).map(c=>c.name).join(', ')};selectedExams.forEach((e,i)=>{const score=x.scores[i];out[e.title]=score&&score.status==='submitted'?Number(score.score||0):''});out['คะแนนรวมที่ได้']=x.sum;out['คะแนนเต็มรวม']=x.total;out['ร้อยละ']=x.percent;return out;});
 const wb=XLSX.utils.book_new();
 const ws=XLSX.utils.aoa_to_sheet([[`ผลคะแนนนักเรียน`],[`ห้องเรียน: ${room}`],[`แบบทดสอบ: ${selectedExams.map(e=>e.title).join(', ')}`],[]]);
 XLSX.utils.sheet_add_json(ws,data,{origin:'A5'});
 XLSX.utils.book_append_sheet(wb,ws,'ผลคะแนนนักเรียน');
 XLSX.writeFile(wb,`ผลคะแนนนักเรียน_${safeFile(room)}.xlsx`);
}
