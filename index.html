n:right}a{color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.stats .card{padding:16px}.stats .stat{font-size:27px}.form-error{color:#a31e37;white-space:pre-wrap;margin-top:14px}.form-error:empty{display:none}button{overflow-wrap:anywhere}.brand{white-space:nowrap}h1,h2,h3,p,td{overflow-wrap:anywhere}header{flex-wrap:wrap}header>div,main,.card,.grid>*{min-width:0}.tabs{flex-wrap:wrap}input,textarea,select{min-width:0}.option input[type=text]{width:0;min-width:0}.tablewrap{max-width:100%}@media(max-width:650px){body{padding-bottom:48px}main{padding:20px 12px 70px}.grid{grid-template-columns:1fr}.card{padding:18px;border-radius:16px}header{padding:14px 16px;position:static}.login{min-height:calc(100vh - 120px);margin:0 auto}.login-panel{padding:26px 20px;border-radius:22px}.timerbar{top:0;border-radius:0;margin-left:-12px;margin-right:-12px;align-items:flex-start}.brand{font-size:21px}h1{font-size:25px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs button{flex:1 1 40%}footer{font-size:11px;max-width:96vw;white-space:normal}}

async function authRequest(path,data){const r=await fetch(SUPABASE_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify(data),signal:AbortSignal.timeout(20000)});const j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||j.message||'เข้าสู่ระบบไม่สำเร็จ');return j}
async function teacherToken(){
 if(!teacher)return null;
 if(teacher.expires_at*1000<Date.now()+60000){
  if(!refreshPromise)refreshPromise=authRequest('token?grant_type=refresh_token',{refresh_token:teacher.refresh_token}).then(j=>{teacher=j;put('te-teacher',j);return j.access_token}).finally(()=>refreshPromise=null);
  return refreshPromise;
 }return teacher.access_token;
}
async function api(action,data={},keepalive=false){data={...data,client_version:2};
 const management=['staff-login','student-login','students','student-save','student-pin','student-password','student-delete','students-import','classes','class-save','class-get','class-members','class-move','class-delete','admin-overview','admin-teachers','admin-create','admin-save','admin-password','admin-delete'].includes(action);
 const headers={'Content-Type':'application/json',apikey:key};
 if(student)headers['x-student-token']=student.token;
 else if(teacher?.token)headers['x-staff-token']=teacher.token;
 else if(teacher)headers.Authorization='Bearer '+await teacherToken();
 const r=await fetch(SUPABASE_URL+'/functions/v1/'+(management?'manage-student':'exam-engine'),{method:'POST',headers,body:JSON.stringify({action,data}),keepalive,signal:keepalive?undefined:AbortSignal.timeout(20000)});
 const j=await r.json();
 if(!r.ok||j?.error){const err=Error(j?.error||'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ');err.details=j;if(j?.unauthorized){persistDraft();current=null;teacher=student=null;sessionStorage.removeItem('te-teacher');sessionStorage.removeItem('te-student');login();}throw err}return j;
}
function newQuestion(kind){return {kind,prompt:'',options:kind==='mcq'?['','']:[],correct_index:kind==='mcq'?0:null,rubric:'',points:1}}
function renderBuilder(){
 const e=builder;app.innerHTML=`<button class="secondary" data-action="exams">← ข้อสอบ</button><form id="exam-form"><div class="card" style="margin-top:18px"><h2>${e.id?'แก้ไขข้อสอบ':'สร้างข้อสอบใหม่'}</h2><p class="muted">เมื่อมีนักเรียนเริ่มสอบแล้ว จะล็อกการแก้ไขข้อสอบนี้ · เวลาที่กรอกใช้เขตเวลาของเครื่อง (${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)})</p><div class="grid"><label>ชื่อข้อสอบ<input name="title" required maxlength="200" value="${esc(e.title)}"></label><label>เวลาเปิด<input name="opens_at" type="datetime-local" required value="${esc(e.opens_at)}"></label><label>เวลาปิด<input name="closes_at" type="datetime-local" required value="${esc(e.closes_at)}"></label><label>เวลาทำข้อสอบ (นาที)<input name="duration_minutes" type="number" min="1" max="720" required value="${e.duration_minutes}"></label></div><p class="muted">คะแนนรวมคำนวณอัตโนมัติจากคะแนนเต็มของแต่ละข้อ</p></div>
 ${assignmentFields(e)}<h2>คำถาม <small>· ${e.questions.length} ข้อ</small></h2>${e.questions.map((q,i)=>`<section class="card builder-question" data-index="${i}"><div class="question-head"><h3>ข้อ ${i+1} · ${q.kind==='mcq'?'ปรนัย':'อัตนัย'}</h3><button type="button" class="danger" data-action="remove-question" data-index="${i}">ลบข้อ</button></div><label>โจทย์<textarea data-field="prompt" required maxlength="10000">${esc(q.prompt)}</textarea></label><label>คะแนนเต็ม<input data-field="points" type="number" min="0.01" step="0.01" required value="${q.points}"></label>${q.kind==='mcq'?`<label>ตัวเลือก · เลือกวงกลมหน้าคำตอบที่ถูกต้อง</label>${q.options.map((o,j)=>`<div class="option"><input type="radio" name="correct${i}" value="${j}" aria-label="ตัวเลือก ${j+1} ถูกต้อง" ${q.correct_index===j?'checked':''} required><input type="text" data-option="${j}" value="${esc(o)}" required maxlength="2000" aria-label="ตัวเลือก ${j+1}"><button type="button" class="secondary" data-action="remove-option" data-index="${i}" data-option="${j}" ${q.options.length<=2?'disabled':''}>ลบ</button></div>`).join('')}<button type="button" class="secondary" data-action="add-option" data-index="${i}" ${q.options.length>=10?'disabled':''}>＋ เพิ่มตัวเลือก</button>`:`<label>แนวคำตอบ / เกณฑ์การให้คะแนน<textarea data-field="rubric" maxlength="10000">${esc(q.rubric)}</textarea></label><small>แนวคำตอบจะแสดงเฉพาะครู นักเรียนจะไม่เห็น</small>`}</section>`).join('')}
 <div class="row"><button class="secondary" type="button" data-action="add-mcq">＋ ปรนัย</button><button class="secondary" type="button" data-action="add-written">＋ อัตนัย</button></div><div class="card" style="margin-top:20px"><div id="point-sum">รวมคะแนนคำถาม: ${e.questions.reduce((s,q)=>s+Number(q.points),0)}</div><button type="submit">บันทึกข้อสอบ</button></div></form>`;
}
function collectBuilder(){const f=$('#exam-form');if(!f)return;const fd=new FormData(f);for(const k of ['title','opens_at','closes_at','duration_minutes','subject','course','description','instructions','state','result_policy'])builder[k]=fd.get(k);builder.published=builder.state==='published';builder.shuffle_questions=fd.has('shuffle_questions');builder.assignments=[...fd.getAll('assign_class').map(class_id=>({class_id})),...fd.getAll('assign_student').map(student_id=>({student_id}))];$$('.builder-question').forEach((el,i)=>{const q=builder.questions[i];q.prompt=el.querySelector('[data-field=prompt]').value;q.points=Number(el.querySelector('[data-field=points]').value);if(q.kind==='mcq'){q.options=[...el.querySelectorAll('[data-option][type=text]')].map(x=>x.value);q.correct_index=Number(el.querySelector('input[type=radio]:checked')?.value??0)}else q.rubric=el.querySelector('[data-field=rubric]').value});builder.total_score=builder.questions.reduce((sum,q)=>sum+Number(q.points||0),0)}
function renderAttemptReport(a){currentReport=a;app.innerHTML=`<button class="secondary" data-action="report" data-id="${a.exam_id}">← รายงาน</button><div class="card" style="margin-top:18px"><span class="pill">${a.status==='submitted'?'ส่งข้อสอบแล้ว':'กำลังทำข้อสอบ'}</span><h1 style="margin-top:12px">${esc(a.student_name)} · ${esc(a.student_code)}</h1><p>${esc(a.title)}</p><div class="stat">${a.score} <small>/ ${a.total_score}</small></div><p class="muted">รอตรวจอัตนัย ${a.pending_grades} ข้อ · เริ่ม ${date(a.started_at)}<br>ครบกำหนด ${date(a.deadline)}${a.submitted_at?'<br>ส่งเมื่อ '+date(a.submitted_at):''}</p><p class="muted">ห้อง: ${esc(a.class_names.join(', '))} · เวลาที่ใช้ ${Math.max(0,Math.round((new Date(a.submitted_at||a.server_now)-new Date(a.started_at))/1000))} วินาที · ${a.submission_type==='auto'?'ส่งอัตโนมัติ':a.submission_type==='manual'?'ส่งด้วยตนเอง':'ยังไม่ส่ง'}</p><small>Attempt: ${a.id}</small></div>${a.questions.map((q,i)=>`<section class="card"><h3>ข้อ ${i+1} · ${q.points} คะแนน</h3><p class="pre">${esc(q.prompt)}</p>${q.kind==='mcq'?`<p class="pre">คำตอบ: ${esc(q.answer==null?'ไม่ได้ตอบ':q.options[q.answer])}</p><p class="good pre">เฉลย: ${esc(q.options[q.correct_index])}</p><strong>ได้ ${q.score??'ยังไม่ตรวจ'} คะแนน</strong>`:`<label>คำตอบนักเรียน</label><p class="pre">${esc(q.answer??'ไม่ได้ตอบ')}</p><label>แนวคำตอบ</label><p class="pre muted">${esc(q.rubric||'ไม่ได้กำหนด')}</p><form class="grade-form" data-id="${q.id}"><div class="grid"><label>คะแนน (เต็ม ${q.points})<input name="score" type="number" min="0" max="${q.points}" step="0.01" required value="${q.score??''}"></label><label>ข้อเสนอแนะ<textarea name="feedback" maxlength="5000">${esc(q.feedback)}</textarea></label></div>${q.graded_at?'<small>ตรวจล่าสุด '+date(q.graded_at)+' · ผู้ตรวจ '+esc(q.graded_by)+'</small><br>':''}<button type="submit" ${a.status!=='submitted'?'disabled':''}>บันทึกคะแนนข้อนี้</button></form>`}</section>`).join('')}<div class="card"><h2>การเปลี่ยนแท็บ / ออกจากเว็บ · ${a.events.filter(e=>['page_hidden','page_exit'].includes(e.kind)).length} ครั้ง</h2><p class="muted">เป็นข้อมูลจากเบราว์เซอร์ อาจขาดหายหรือถูกดัดแปลงได้ ระยะเวลาห่างจากหน้าเป็นค่าประมาณ ระบบไม่ทราบว่านักเรียนเปิดเว็บไซต์ใด</p><div class="tablewrap"><table><thead><tr><th>เหตุการณ์</th><th>เวลาเครื่องนักเรียน</th><th>เวลาที่เซิร์ฟเวอร์รับ</th></tr></thead><tbody>${timeline(a.events)}</tbody></table></div></div>`}
const cacheKey=id=>'te-draft-'+id, eventsKey=id=>'te-events-'+id;
function syncClock(a){clockBase=new Date(a.server_now).getTime();clockMark=performance.now()}
function remaining(){return Math.max(0,new Date(current.deadline).getTime()-(clockBase+performance.now()-clockMark))}
function persistDraft(){if(current)put(cacheKey(current.id),{revision:current.revision,answers:draft,dirty})}
function adopt(a,restore=true){if(a.status==='in_progress')put('te-active-attempt',{id:a.id,student_id:profile.id});else sessionStorage.removeItem('te-active-attempt');current=a;syncClock(a);draft=Object.fromEntries(a.questions.map(q=>[q.id,q.answer??null]));dirty=false;conflict=false;const c=read(cacheKey(a.id));if(restore&&a.status==='in_progress'&&c?.dirty){if(c.revision===a.revision){draft={...draft,...c.answers};dirty=true}else{conflict=true;toast('พบคำตอบค้างในเครื่องที่ต่างจากเซิร์ฟเวอร์ กรุณาเลือกโหลดคำตอบล่าสุด')}}if(!restore)persistDraft();if(a.status==='submitted')sessionStorage.removeItem(cacheKey(a.id));renderAttempt();if(a.status==='in_progress'){if(dirty&&!conflict)queueSave()} }
function renderAttempt(){const a=current;if(a.status==='submitted'){app.innerHTML=`<div class="card" style="max-width:720px;margin:30px auto"><span class="pill">ส่งข้อสอบแล้ว</span><h1 style="margin-top:16px">บันทึกผลสอบเรียบร้อย</h1><p>${esc(a.title)}</p><div class="stat">${a.result_visible?a.score:'รอประกาศคะแนน'} <small>${a.result_visible?'/ '+a.total_score:''}</small></div><p class="muted">${a.pending_grades?'คะแนนยังไม่ครบ รอครูตรวจอัตนัย '+a.pending_grades+' ข้อ':'ตรวจครบทุกข้อแล้ว'}<br>ส่งเมื่อ ${date(a.submitted_at)}</p><small>Attempt: ${a.id}</small>${a.questions.filter(q=>q.feedback).map(q=>`<p class="pre">ข้อ ${q.position}: ${esc(q.feedback)}</p>`).join('')}<hr class="divider"><button data-action="student-home">กลับหน้าหลัก</button></div>`;return}
 app.innerHTML=`<div class="timerbar"><div><strong>${esc(a.title)}</strong><br><small id="save-status">${dirty?'มีคำตอบรอบันทึก':'บันทึกบนเซิร์ฟเวอร์แล้ว'}</small></div><div class="right"><small>เวลาที่เหลือ</small><div class="timer" id="timer">--:--</div></div></div><div id="conflict-box" class="notice" ${conflict?'':'hidden'}>มีคำตอบต่างกันระหว่างเครื่องนี้กับเซิร์ฟเวอร์ ระบบหยุดบันทึกเพื่อไม่เขียนทับ<button class="secondary" data-action="reload-attempt">โหลดคำตอบล่าสุด (ละทิ้งคำตอบค้างในเครื่อง)</button></div><details class="card"><summary>คำชี้แจง</summary><p class="pre">${esc(a.instructions||'ไม่มีคำชี้แจงเพิ่มเติม')}</p></details><p class="muted">มี ${a.questions.length} ข้อ · ${a.total_score} คะแนน · บันทึกอัตโนมัติ · ระบบบันทึกเหตุการณ์เปลี่ยนแท็บและออกจากหน้า</p>${a.questions.map((q,i)=>`<section class="card"><div class="question-head"><h3>ข้อ ${i+1}</h3><span class="pill">${q.points} คะแนน</span></div><p class="pre">${esc(q.prompt)}</p>${q.kind==='mcq'?q.options.map((o,j)=>`<label class="choice"><input type="radio" name="answer-${q.id}" data-answer="${q.id}" value="${j}" ${draft[q.id]===j?'checked':''}><span class="pre">${esc(o)}</span></label>`).join(''):`<label for="a-${q.id}">คำตอบของคุณ</label><textarea id="a-${q.id}" data-answer="${q.id}" maxlength="20000" rows="5">${esc(draft[q.id]??'')}</textarea>`}</section>`).join('')}<div class="card row between"><span id="answered-count"></span><button data-action="submit-exam">ส่งข้อสอบ</button></div>`;updateCount();tick();}
function updateCount(){if($('#answered-count'))$('#answered-count').textContent='ตอบแล้ว '+Object.values(draft).filter(v=>v!==null&&String(v).trim()!=='').length+' / '+current.questions.length+' ข้อ'}
function status(text){if($('#save-status'))$('#save-status').textContent=text}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>save().catch(()=>{}),900)}
function save(submit=false){saveChain=saveChain.catch(()=>{}).then(async()=>{
 if(!current||current.status!=='in_progress')return;
 if(conflict){if(submit)throw Error('กรุณาแก้ไขคำตอบที่ขัดแย้งก่อนส่ง');return}
 if(!dirty&&!submit)return;
 const id=current.id, snapshot={...draft}, rev=current.revision;
 status('กำลังบันทึก…');
 try{const a=await api(submit?'submit':'save',{attempt_id:id,revision:rev,answers:snapshot});if(current?.id!==id)return;
  current=a;syncClock(a);dirty=JSON.stringify(draft)!==JSON.stringify(snapshot);persistDraft();
  if(a.status==='submitted'){sessionStorage.removeItem('te-active-attempt');dirty=false;sessionStorage.removeItem(cacheKey(id));renderAttempt()}
  else status(dirty?'มีคำตอบใหม่รอบันทึก':'บันทึกบนเซิร์ฟเวอร์แล้ว · '+new Date().toLocaleTimeString('th-TH'));
 }catch(err){if(err.details?.conflict){conflict=true;$('#conflict-box')?.removeAttribute('hidden');status('หยุดบันทึก: มีการแก้ไขจากอีกแท็บ/อุปกรณ์')}else status('ยังไม่บันทึกบนเซิร์ฟเวอร์ · จะลองใหม่เมื่อเชื่อมต่อได้');if(submit)throw err;}
 });return saveChain;}
let expiring=false;
function tick(){if(!current||current.status!=='in_progress')return;const ms=remaining(),s=Math.ceil(ms/1000);if($('#timer')){$('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('#timer').style.color=s<60?'#ffadad':'white'}if(ms<=0&&!expiring){expiring=true;$$('[data-answer], [data-action="submit-exam"]').forEach(x=>x.disabled=true);status('ครบกำหนดแล้ว กำลังตรวจสถานะการส่ง…');saveChain.catch(()=>{}).then(()=>api('attempt',{attempt_id:current.id})).then(a=>{if(a.status==='submitted')adopt(a,false);else syncClock(a)}).catch(()=>status('หมดเวลาแล้ว · รอเชื่อมต่อเพื่อตรวจผลการส่ง')).finally(()=>expiring=false)}}
function recordEvent(kind){if(!current||current.status!=='in_progress')return;const id=current.id;const list=read(eventsKey(id),[]);list.push({id:crypto.randomUUID(),kind,client_at:new Date().toISOString()});put(eventsKey(id),list.slice(-500));if(kind==='page_exit'||kind==='page_hidden'){persistDraft();void flushEvents(true)}else void flushEvents()}
async function flushEvents(keepalive=false){if(!current||eventSending)return;const id=current.id,list=read(eventsKey(id),[]).slice(0,50);if(!list.length)return;eventSending=true;try{await api('events',{attempt_id:id,events:list},keepalive);const sent=new Set(list.map(x=>x.id));put(eventsKey(id),read(eventsKey(id),[]).filter(x=>!sent.has(x.id)))}catch{}finally{eventSending=false}}
let lastHiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){lastHiddenAt=Date.now();recordEvent('page_hidden')}else{recordEvent('page_visible');void save()}});window.addEventListener('pagehide',()=>{if(Date.now()-lastHiddenAt>1200)recordEvent('page_exit')});window.addEventListener('pageshow',e=>{if(e.persisted)recordEvent('page_return')});
window.addEventListener('beforeunload',e=>{if(current?.status==='in_progress'&&dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('input',e=>{const id=e.target.dataset.answer;if(id&&current?.status==='in_progress'){draft[id]=e.target.type==='radio'?Number(e.target.value):e.target.value;dirty=true;persistDraft();status('มีคำตอบรอบันทึก…');updateCount();queueSave()}});

async function studentHome(){current=null;const [list,assigned]=await Promise.all([api('my-attempts'),api('assigned-exams')]);app.innerHTML=`<div class="hero"><span class="pill">พื้นที่นักเรียน</span><h1 style="margin-top:12px">สวัสดี ${esc(profile.name)}</h1><p class="muted">รหัสนักเรียน ${esc(profile.student_code)} · ห้อง ${esc(profile.classes.map(c=>c.name).join(', ')||'ยังไม่มีห้องเรียน')}<br>หากข้อมูลไม่ถูกต้อง กรุณาติดต่อครูผู้ดูแล</p></div><h2>ข้อสอบที่ได้รับมอบหมาย</h2><div class="grid">${assigned.map(e=>`<section class="card"><span class="pill">${e.attempt_status==='submitted'?'ส่งแล้ว':e.state==='closed'?'ปิดรับการสอบใหม่':new Date(e.server_now)<new Date(e.opens_at)?'ยังไม่ถึงเวลา':new Date(e.server_now)>=new Date(e.closes_at)?'หมดเวลารับข้อสอบ':'เปิดสอบ'}</span><h2>${esc(e.title)}</h2><small>${esc([e.subject,e.course].filter(Boolean).join(' · '))}</small><p class="pre">${esc(e.description)}</p><p class="muted">${date(e.opens_at)} – ${date(e.closes_at)}<br>${e.duration_minutes} นาที · ${e.total_score} คะแนน</p><details><summary>คำชี้แจง</summary><p class="pre">${esc(e.instructions||'ไม่มีคำชี้แจงเพิ่มเติม')}</p></details><button style="margin-top:15px" data-action="${e.attempt_id?'resume':'start-assigned'}" data-id="${e.attempt_id||e.id}" ${!e.attempt_id&&(e.state!=='published'||new Date(e.server_now)<new Date(e.opens_at)||new Date(e.server_now)>=new Date(e.closes_at))?'disabled':''}>${e.attempt_id?'เปิดข้อสอบ / ดูผล':'เริ่มสอบ'}</button></section>`).join('')||'<div class="card empty">ยังไม่มีข้อสอบที่ได้รับมอบหมาย</div>'}</div><h2 style="margin-top:24px">ประวัติการสอบ</h2>${list.map(a=>`<div class="card row between"><div><h3>${esc(a.title)}</h3><small>${a.status==='submitted'?a.result_visible?'คะแนน '+a.score+' / '+a.total_score:'ส่งแล้ว · รอประกาศคะแนน':'กำลังทำ · หมดเวลา '+date(a.deadline)}</small></div><button class="secondary" data-action="resume" data-id="${a.id}">${a.status==='submitted'?'ดูผล':'ทำต่อ'}</button></div>`).join('')||'<div class="card empty">ยังไม่มีประวัติการสอบ</div>'}`;}
function eventLabel(k){return {page_hidden:'เปลี่ยนแท็บ / ซ่อนหน้าเว็บ',page_visible:'กลับมาที่หน้าเว็บ',page_exit:'ออกจากหน้าเว็บ',page_return:'กลับเข้าหน้าเว็บ'}[k]||k;}
function timeline(events){events=events.filter(e=>['page_hidden','page_visible','page_exit','page_return'].includes(e.kind));const pairs={page_hidden:'page_visible',page_exit:'page_return'},opened={};return events.map(e=>{const time=new Date(e.client_at||e.received_at).getTime();let duration='';for(const [start,end] of Object.entries(pairs))if(e.kind===end&&opened[start]!=null){const seconds=Math.max(0,Math.round((time-opened[start])/1000));duration=` · ห่างไปประมาณ ${seconds} วินาที`;delete opened[start];}if(pairs[e.kind]&&opened[e.kind]==null)opened[e.kind]=time;return `<tr><td>${esc(eventLabel(e.kind)+duration)}</td><td>${e.client_at?date(e.client_at):'—'}</td><td>${date(e.received_at)}</td></tr>`;}).join('');}
async function report(id,classId=window._reportClass||''){lastExam=id;currentReport=null;window._reportClass=classId;const payload={exam_id:id,...(classId?{class_id:classId}:{})};const [rows,summary]=await Promise.all([api('report',payload),api('report-summary',payload)]);window._reportRows=rows;window._reportSummary=summary;const e=exams.find(x=>x.id===id)||{};app.innerHTML=`<div class="row between"><h1>รายงานผลสอบ</h1><button class="secondary" data-action="exams">← ย้อนกลับ</button></div><div class="card"><label>แสดงผลตามห้องเรียน<select id="report-class-filter"><option value="">ทุกห้องเรียน</option>${classes.filter(c=>!c.archived).map(c=>`<option value="${c.id}" ${c.id===classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div><div class="stats">${[['มอบหมาย',summary.assigned],['เริ่มสอบ',summary.started],['ส่งแล้ว',summary.submitted],['ยังไม่เริ่ม',Math.max(0,summary.assigned-summary.started)],['คะแนนเฉลี่ย',summary.average??'—'],['คะแนนสูงสุด',summary.maximum??'—'],['คะแนนต่ำสุด',summary.minimum??'—']].map(([l,v])=>`<div class="card"><small>${l}</small><div class="stat">${v}</div></div>`).join('')}</div><div class="card"><div class="row"><button class="secondary" data-action="report" data-id="${id}">รีเฟรชรายงาน</button><button class="secondary" data-action="export-report" data-id="${id}">ส่งออก Excel</button></div><div class="tablewrap"><table><thead><tr><th>เลขที่</th><th>รหัสนักเรียน</th><th>ชื่อ / ห้อง</th><th>เริ่ม / ส่ง</th><th>สถานะ</th><th>คะแนน</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.student_number||'-')}</td><td>${esc(r.student_code)}</td><td>${esc(r.student_name)}<br><small>${esc(r.class_names.join(', '))}</small></td><td>${date(r.started_at)}<br><small>${r.submitted_at?date(r.submitted_at):'ยังไม่ส่ง'}</small></td><td>${r.status==='submitted'?(r.submission_type==='auto'?'ส่งอัตโนมัติ':'ส่งแล้ว'):'กำลังทำ'}${r.pending_grades?'<br>รอตรวจ '+r.pending_grades+' ข้อ':''}</td><td>${r.score} / ${r.total_score}</td><td><button data-action="attempt-report" data-id="${r.id}">คำตอบและเหตุการณ์</button></td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<div class="empty">ยังไม่มีนักเรียนเริ่มสอบในห้องที่เลือก</div>'}</div>`;}
function requireXLSX(){if(typeof XLSX==='undefined')throw Error('โหลดระบบ Excel ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่')}
function downloadStudentTemplate(){requireXLSX();const ws=XLSX.utils.aoa_to_sheet([['เลขที่','รหัสนักเรียน','ชื่อ–นามสกุล','รหัสผ่าน','ห้องเรียน'],['1','TEST001','นักเรียนทดสอบ 1','1234','ม.5/1']]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'นักเรียน');XLSX.writeFile(wb,'แบบฟอร์มนำเข้านักเรียน.xlsx')}
function importStudentsForm(){app.innerHTML=`<button class="secondary" data-action="students">← ย้อนกลับ</button><div class="card" style="margin-top:18px"><div class="row between"><div><h1>นำเข้านักเรียนจาก Excel</h1><p class="muted">หัวคอลัมน์ต้องเป็น: เลขที่, รหัสนักเรียน, ชื่อ–นามสกุล, รหัสผ่าน, ห้องเรียน และชื่อห้องต้องมีอยู่ในระบบแล้ว</p></div><button class="secondary" data-action="download-student-template">ดาวน์โหลดแบบฟอร์ม Excel</button></div><label>ไฟล์ Excel<input id="student-excel" type="file" accept=".xlsx,.xls"></label><button data-action="preview-student-excel" style="margin-top:10px">ตรวจสอบไฟล์ Excel</button><div id="import-preview" style="margin-top:18px"></div></div>`;}
async function previewStudentExcel(file){requireXLSX();const wb=XLSX.read(await file.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});const classMap=new Map(classes.filter(c=>!c.archived).map(c=>[c.name.trim(),c.id]));const existingNumbers=new Set();students.forEach(s=>(s.classes||[]).forEach(c=>{if(c.student_number)existingNumbers.add(c.id+'|'+String(c.student_number).trim())}));const seenCode=new Set(),seenNo=new Set();const parsed=rows.map((r,i)=>{const student_number=String(r['เลขที่']||'').trim(),code=String(r['รหัสนักเรียน']||'').trim().toUpperCase(),name=String(r['ชื่อ–นามสกุล']||'').trim(),password=String(r['รหัสผ่าน']||''),className=String(r['ห้องเรียน']||'').trim(),class_id=classMap.get(className);let error='';if(!/^\d{1,3}$/.test(student_number)||Number(student_number)<1)error='เลขที่ไม่ถูกต้อง';else if(!/^[A-Z0-9_-]{1,40}$/.test(code))error='รหัสนักเรียนไม่ถูกต้อง';else if(!name)error='ไม่มีชื่อ';else if(!/^\d{4}$/.test(password))error='รหัสผ่านต้องเป็นตัวเลข 4 ตัว';else if(!class_id)error='ไม่พบห้องเรียน';else if(seenCode.has(code))error='รหัสซ้ำในไฟล์';else if(seenNo.has(class_id+'|'+student_number))error='เลขที่ซ้ำในห้องเดียวกัน';else if(existingNumbers.has(class_id+'|'+student_number))error='เลขที่นี้มีอยู่แล้วในห้อง';seenCode.add(code);if(class_id)seenNo.add(class_id+'|'+student_number);return {row:i+2,student_number,student_code:code,name,password,class_id,class_name:className,error}});window._studentImport=parsed;const ok=parsed.filter(x=>!x.error);$('#import-preview').innerHTML=`<p><strong>พร้อมนำเข้า ${ok.length}</strong> · มีปัญหา ${parsed.length-ok.length}</p><div class="tablewrap"><table><thead><tr><th>แถว</th><th>เลขที่</th><th>รหัส</th><th>ชื่อ</th><th>ห้อง</th><th>สถานะ</th></tr></thead><tbody>${parsed.map(x=>`<tr><td>${x.row}</td><td>${esc(x.student_number)}</td><td>${esc(x.student_code)}</td><td>${esc(x.name)}</td><td>${esc(x.class_name)}</td><td class="${x.error?'danger':'good'}">${esc(x.error||'พร้อมนำเข้า')}</td></tr>`).join('')}</tbody></table></div><button data-action="confirm-import-students" ${parsed.some(x=>x.error)||!parsed.length?'disabled':''}>นำเข้า ${ok.length} คน</button>`;}
function exportReportExcel(){requireXLSX();const rows=window._reportRows||[],summary=window._reportSummary||{};const e=exams.find(x=>x.id===lastExam)||{};const room=classes.find(c=>c.id===window._reportClass)?.name||'ทุกห้องเรียน';const data=rows.map(r=>({'เลขที่':r.student_number||'','รหัสนักเรียน':r.student_code,'ชื่อ–นามสกุล':r.student_name,'ห้องเรียน':(r.class_names||[]).join(', '),'สถานะ':r.status==='submitted'?'ส่งแล้ว':'กำลังทำ','คะแนน':r.score,'คะแนนเต็ม':r.total_score,'เริ่มสอบ':date(r.started_at),'ส่งข้อสอบ':r.submitted_at?date(r.submitted_at):''}));const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet([[`ข้อสอบ: ${e.title||''}`],[`วิชา: ${e.subject||''}`],[`รหัสวิชา: ${e.course||''}`],[`ห้องเรียน: ${room}`],[`เฉลี่ย: ${summary.average??'-'} | สูงสุด: ${summary.maximum??'-'} | ต่ำสุด: ${summary.minimum??'-'}`],[]]);XLSX.utils.sheet_add_json(ws,data,{origin:'A7'});XLSX.utils.book_append_sheet(wb,ws,'ผลสอบ');XLSX.writeFile(wb,`ผลสอบ_${(e.title||'exam').replace(/[\\/:*?"<>|]/g,'_')}_${room.replace(/[\\/:*?"<>|]/g,'_')}.xlsx`)}
async function extraSubmit(f,d){const id=f.getAttribute('id');
 if(id==='login-form'){teacher=student=null;sessionStorage.removeItem('te-teacher');sessionStorage.removeItem('te-student');const username=d.username.trim();const password=d.password;const looksEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(username);const loginAuth=async()=>{teacher=await authRequest('token?grant_type=password',{email:username,password});put('te-teacher',teacher)};const loginStaff=async()=>{teacher=await api('staff-login',{username,password});put('te-teacher',teacher)};const loginStudent=async()=>{student=await api('student-login',{code:username,password});put('te-student',student)};try{if(looksEmail){try{await loginAuth()}catch(e0){try{await loginStaff()}catch(e1){await loginStudent()}}}else{try{await loginStaff()}catch(e1){try{await loginStudent()}catch(e2){await loginAuth()}}}}catch(e){throw Error('Username หรือ Password ไม่ถูกต้อง');}await home();}
 else if(id==='profile-form'){await api('profile-save',d);profile=await api('me');account();profileForm();toast('บันทึกโปรไฟล์แล้ว');}
 else if(id==='own-password'){if(d.password!==d.confirm_password)throw Error('รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน');await api('staff-own-password',{current_password:d.current_password,password:d.password});profileForm();toast('เปลี่ยนรหัสผ่านเรียบร้อย');}
 else if(id==='class-form'){await api('class-save',d);await teacherHome('classes');toast('บันทึกห้องเรียนแล้ว');}
 else if(id==='members-form'){const fd=new FormData(f);const memberIds=fd.getAll('student_ids');await api('class-members',{class_id:d.class_id,members:memberIds.map(student_id=>({student_id,student_number:String(fd.get('student_number_'+student_id)||'').trim()}))});await classMembers(d.class_id);toast('บันทึกสมาชิกแล้ว');}
 else if(id==='move-form'){await api('class-move',d);await classMembers(d.from_id);toast('ย้ายห้องเรียนแล้ว');}
 else if(id==='staff-form'){const data={...d,active:d.id?new FormData(f).has('active'):true};if(!d.id)delete data.id;await api(d.id?'admin-save':'admin-create',data);await adminHome();toast('บันทึกครูแล้ว');}
 else if(id==='staff-password'){await api('admin-password',d);await adminHome();toast('รีเซ็ตรหัสผ่านครูแล้ว');}
 else if(id==='state-form'){await api('exam-state',d);await teacherHome();toast('เปลี่ยนสถานะข้อสอบแล้ว');}
 else return false;return true;
}
async function extraClick(action,id,b){
 if(action==='classes')await teacherHome('classes');
 else if(action==='profile'){profile=await api('me');profileForm();}
 else if(action==='new-class')classForm();
 else if(action==='edit-class')classForm(classes.find(c=>c.id===id));
 else if(action==='class-members')await classMembers(id);
 else if(action==='admin-home')await adminHome();
 else if(action==='new-teacher')teacherForm();
 else if(action==='edit-teacher')teacherForm(staff.find(t=>t.id===id));
 else if(action==='teacher-password'){const t=staff.find(t=>t.id===id);app.innerHTML=`<button class="secondary" data-action="admin-home">← ผู้ดูแลระบบ</button><form id="staff-password" class="card"><h2>รีเซ็ตรหัสผ่าน · ${esc(t.name)}</h2><input name="id" type="hidden" value="${id}">${field('รหัสผ่านใหม่ครู 8 ตัว','password','','password','required minlength="8" maxlength="8" autocomplete="new-password"')}<button type="submit">บันทึกรหัสผ่านใหม่</button></form>`;}
 else if(action==='delete-teacher'){const t=staff.find(t=>t.id===id);if(t&&confirm(`ลบครู ${t.name}?\nระบบจะลบบัญชีครู ข้อสอบ ห้องเรียน นักเรียน ผลสอบ และข้อมูลทั้งหมดของครูคนนี้ถาวร ไม่สามารถกู้คืนได้`)){await api('admin-delete',{id});await adminHome();toast('ลบครูและข้อมูลทั้งหมดแล้ว')}}
 else if(action==='reset-pin'){const s=students.find(s=>s.id===id);app.innerHTML=`<button class="secondary" data-action="students">← นักเรียน</button><form id="pin-form" class="card" style="margin-top:18px"><h2>รีเซ็ตรหัสผ่าน · ${esc(s.name)}</h2><input name="id" type="hidden" value="${id}">${field('รหัสผ่านใหม่','password','','password','required minlength="4" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" autocomplete="new-password"')}<p class="muted">นักเรียนต้องเข้าสู่ระบบใหม่ในทุกอุปกรณ์</p><button type="submit">บันทึกรหัสผ่านใหม่</button></form>`;}

 else if(action==='delete-student'){const st=students.find(x=>x.id===id);if(st&&confirm(`ลบนักเรียน ${st.name} ออกจากระบบของครูคนนี้?`)){await api('student-delete',{id});await teacherHome('students');toast('ลบนักเรียนแล้ว')}}
 else if(action==='delete-class'){const c=classes.find(x=>x.id===id);if(c&&confirm(`ลบห้องเรียน ${c.name}?\nนักเรียนในห้องนี้จะถูกลบออกจากข้อมูลนักเรียนของคุณด้วย`)){await api('class-delete',{id});window._studentClassFilter='';await teacherHome('classes');toast('ลบห้องเรียนและนักเรียนในห้องแล้ว')}}
 else if(action==='delete-exam'){const e=exams.find(x=>x.id===id);if(e&&confirm(`ลบข้อสอบ ${e.title}?\nระบบจะลบข้อสอบ คำถาม คำตอบ ผลสอบ และเหตุการณ์ทั้งหมดของข้อสอบนี้ถาวร`)){await api('exam-delete',{id});await teacherHome('exams');toast('ลบข้อสอบถาวรแล้ว')}}
 else if(action==='download-student-template')downloadStudentTemplate();
 else if(action==='import-students')importStudentsForm();
 else if(action==='preview-student-excel'){const file=$('#student-excel')?.files?.[0];if(!file)throw Error('กรุณาเลือกไฟล์ Excel ก่อน');await previewStudentExcel(file);}
 else if(action==='confirm-import-students'){await api('students-import',{students:(window._studentImport||[]).filter(x=>!x.error).map(({student_number,student_code,name,password,class_id})=>({student_number,student_code,name,password,class_id}))});window._studentImport=null;await teacherHome('students');toast('นำเข้านักเรียนเรียบร้อยแล้ว')}
 else if(action==='export-report')exportReportExcel();
 else if(action==='exam-status'){const e=exams.find(e=>e.id===id);app.innerHTML=`<button class="secondary" data-action="exams">← ย้อนกลับ</button><form id="state-form" class="card" style="margin-top:18px"><h2>${esc(e.title)}</h2><input name="id" type="hidden" value="${id}"><label>สถานะ<select name="state">${['draft','published','closed'].map(s=>`<option value="${s}" ${s===e.state?'selected':''}>${stateLabel(s)}</option>`).join('')}</select></label><label>การประกาศคะแนน<select name="result_policy">${[['after_grading','เมื่อครูตรวจครบ'],['after_submit','ทันทีหลังส่ง'],['after_close','หลังเวลาปิด'],['hidden','ยังไม่แสดง']].map(([v,l])=>`<option value="${v}" ${v===e.result_policy?'selected':''}>${l}</option>`).join('')}</select></label><p class="muted">ปิดรับการสอบใหม่: นักเรียนที่เริ่มแล้วทำต่อได้จนถึงกำหนดเดิม</p><button type="submit">บันทึกสถานะ</button></form>`;}
 else if(action==='start-assigned')adopt(await api('start',{exam_id:id}));
 else return false;return true;
}
function formError(f,error){let box=f.querySelector('.form-error');if(!box){box=document.createElement('div');box.className='form-error';box.setAttribute('role','alert');f.append(box);}box.textContent=error.message+(error.details?.requestId?' · รหัสอ้างอิง '+error.details.requestId:'');toast(error.message);}

document.addEventListener('submit',async event=>{event.preventDefault();const f=event.target,button=f.querySelector('button[type=submit]');if(button)button.disabled=true;try{
 const d=Object.fromEntries(new FormData(f));
 if(!publicKeyValid(key))throw Error('กรุณาตั้งค่า Public key ก่อน');
 if(await extraSubmit(f,d))return;
 if(f.getAttribute('id')==='teacher-login'){student=null;sessionStorage.removeItem('te-student');teacher=await authRequest('token?grant_type=password',d);put('te-teacher',teacher);await home()}
 else if(f.getAttribute('id')==='student-login'){teacher=null;sessionStorage.removeItem('te-teacher');student=await api('student-login',d);put('te-student',student);await home()}
 else if(f.getAttribute('id')==='student-form'){await api('student-save',{...d,active:d.id?new FormData(f).has('active'):true});await teacherHome('students');toast('บันทึกบัญชีแล้ว')}
 else if(f.getAttribute('id')==='pin-form'){await api('student-pin',d);await teacherHome('students');toast('รีเซ็ตรหัสผ่านและยกเลิกเซสชันเดิมแล้ว')}
 else if(f.getAttribute('id')==='exam-form'){collectBuilder();const payload={...builder,opens_at:new Date(builder.opens_at).toISOString(),closes_at:new Date(builder.closes_at).toISOString()};await api('exam-save',payload);await teacherHome();toast('บันทึกข้อสอบแล้ว')}

 else if(f.classList.contains('grade-form')){const a=await api('grade',{attempt_id:currentReport.id,question_id:f.dataset.id,...d});renderAttemptReport(a);toast('บันทึกคะแนนแล้ว')}
 else throw Error('ไม่พบคำสั่งของแบบฟอร์ม กรุณารีเฟรชหน้า');
 }catch(err){formError(f,err)}finally{if(button)button.disabled=false}});
document.addEventListener('click',async event=>{const b=event.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;b.disabled=true;try{
 if(await extraClick(action,id,b))return;
 if(action==='logout'){if(current?.status==='in_progress'){await save();if(dirty||conflict){throw Error('ยังมีคำตอบที่บันทึกไม่สำเร็จ กรุณารอหรือโหลดคำตอบล่าสุดก่อนออกจากระบบ')}recordEvent('page_exit');await flushEvents()}
  if(student)await api('logout');if(teacher?.token)await api('logout');else if(teacher){const token=await teacherToken();const r=await fetch(SUPABASE_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+token}});if(!r.ok&&r.status!==401)throw Error('ออกจากระบบไม่สำเร็จ กรุณาลองใหม่')}
  teacher=student=null;sessionStorage.removeItem('te-teacher');sessionStorage.removeItem('te-student');login();
 }else if(action==='students'||action==='exams')await teacherHome(action);
 else if(action==='new-student')studentForm();
 else if(action==='edit-student')studentForm(students.find(s=>s.id===id));
 else if(action==='new-exam'){builder={title:'',opens_at:localDate(Date.now()),closes_at:localDate(Date.now()+86400000),duration_minutes:60,total_score:1,published:false,state:'draft',result_policy:'after_grading',assignments:[],questions:[newQuestion('mcq')]};renderBuilder()}
 else if(action==='edit-exam'){builder=await api('exam-get',{exam_id:id});builder.opens_at=localDate(builder.opens_at);builder.closes_at=localDate(builder.closes_at);renderBuilder()}
 else if(['add-mcq','add-written','remove-question','add-option','remove-option'].includes(action)){collectBuilder();const i=Number(b.dataset.index),j=Number(b.dataset.option);if(action.startsWith('add-')&&['add-mcq','add-written'].includes(action))builder.questions.push(newQuestion(action==='add-mcq'?'mcq':'written'));if(action==='remove-question')builder.questions.splice(i,1);if(action==='add-option')builder.questions[i].options.push('');if(action==='remove-option'){const q=builder.questions[i];q.options.splice(j,1);q.correct_index=q.correct_index===j?0:q.correct_index>j?q.correct_index-1:q.correct_index}const y=window.scrollY;renderBuilder();window.scrollTo(0,y)}
 else if(action==='report')await report(id,window._reportClass||'');
 else if(action==='attempt-report')renderAttemptReport(await api('attempt-report',{attempt_id:id}));
 else if(action==='student-home')await studentHome();
 else if(action==='resume')adopt(await api('attempt',{attempt_id:id}));
 else if(action==='reload-attempt'){if(confirm('ละทิ้งคำตอบค้างในเครื่อง แล้วใช้คำตอบล่าสุดจากเซิร์ฟเวอร์?'))adopt(await api('attempt',{attempt_id:current.id}),false)}
 else if(action==='submit-exam'){if(confirm('ยืนยันส่งข้อสอบ? ส่งแล้วจะไม่สามารถแก้ไขคำตอบได้'))await save(true)}
 }catch(err){toast(err.message)}finally{b.disabled=false}});
document.addEventListener('invalid',e=>{toast('กรุณาตรวจช่อง '+(e.target.closest('label')?.textContent.trim()||e.target.name)+' ให้ครบถ้วน');},true);
document.addEventListener('input',e=>{if(e.target.matches('[data-field=points]')&&$('#point-sum'))$('#point-sum').textContent='รวมคะแนนคำถาม: '+$$('[data-field=points]').reduce((n,x)=>n+Number(x.value||0),0).toFixed(2);});
setInterval(tick,1000);setInterval(()=>{if(current?.status==='in_progress'){void save();void flushEvents()}},10000);
(async()=>{if(!key||(!teacher&&!student))return login();try{await home()}catch(e){teacher=student=null;sessionStorage.removeItem('te-teacher');sessionStorage.removeItem('te-student');login();toast(e.message)}})();
</script>
</body>
